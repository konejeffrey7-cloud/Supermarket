<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperMarket – Caisse</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201a;--mut:#667a70;--bd:#dfe6e2;--pri:#0f8a4f;--prit:#fff;--warn:#c2410c;--warnbg:#ffedd5;--soft:#e7f5ed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--tx:#e8f1ec;--mut:#93a89c;--bd:#2a3a31;--pri:#2fbf7a;--prit:#06210f;--warn:#fdba74;--warnbg:#3a2412;--soft:#16301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--tx:#e8f1ec;--mut:#93a89c;--bd:#2a3a31;--pri:#2fbf7a;--prit:#06210f;--warn:#fdba74;--warnbg:#3a2412;--soft:#16301f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
h1{font-size:18px;margin:0}.sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.tab.on,.chip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
main{padding:0 16px 24px;max-width:1000px;margin:auto}
.pos{display:grid;gap:14px}
@media(min-width:800px){.pos{grid-template-columns:1fr 340px;align-items:start}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;font-size:13px;padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--tx);font:inherit;position:relative}
.p:active{transform:scale(.97)}.p[disabled]{opacity:.45;cursor:not-allowed}
.p .e{font-size:28px}.p b{display:block;font-size:14px;margin-top:4px}.p span{color:var(--pri);font-weight:600}
.p small{display:block;color:var(--mut);font-size:11px}
.badge{position:absolute;top:8px;right:8px;background:var(--warnbg);color:var(--warn);font-size:10px;padding:2px 6px;border-radius:999px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.panel h2{font-size:15px;margin:0 0 10px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.line .n{flex:1}.line small{color:var(--mut)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:16px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:12px 0}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.pay button{padding:8px 4px;font-size:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.pay button.on{border-color:var(--pri);background:var(--soft);color:var(--pri);font-weight:600}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--prit);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar.low i{background:var(--warn)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi b{display:block;font-size:17px}.kpi small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div><h1>🛒 SuperMarket</h1><div class="sub">Caisse n° 1 · Admin SuperMarket</div></div><div class="sub" id="clock"></div></header>
<div class="tabs" id="tabs"></div>
<main id="view"></main>
<div id="toast"></div>
<script>
var CATS=["Tout","Alimentation","Boissons","Services & Divers"];
var items=[
{id:1,n:"Riz parfumé 5 kg",c:"Alimentation",p:4500,s:40,t:5,e:"🍚"},
{id:2,n:"Huile végétale 1 L",c:"Alimentation",p:1500,s:25,t:8,e:"🫒"},
{id:3,n:"Sucre 1 kg",c:"Alimentation",p:800,s:4,t:5,e:"🧂"},
{id:4,n:"Pain de mie",c:"Alimentation",p:900,s:18,t:5,e:"🍞"},
{id:5,n:"Œufs (plateau)",c:"Alimentation",p:2200,s:12,t:4,e:"🥚"},
{id:6,n:"Eau minérale 1,5 L",c:"Boissons",p:500,s:60,t:10,e:"💧"},
{id:7,n:"Jus de bissap",c:"Boissons",p:700,s:3,t:5,e:"🍹"},
{id:8,n:"Soda 33 cl",c:"Boissons",p:400,s:48,t:10,e:"🥤"},
{id:9,n:"Café soluble",c:"Boissons",p:1800,s:15,t:5,e:"☕"},
{id:10,n:"Recharge téléphone",c:"Services & Divers",p:1000,s:0,t:0,e:"📱",svc:1},
{id:11,n:"Livraison à domicile",c:"Services & Divers",p:1500,s:0,t:0,e:"🛵",svc:1},
{id:12,n:"Sac réutilisable",c:"Services & Divers",p:300,s:100,t:10,e:"🛍️"}
];
var customers=[{id:0,n:"Client comptoir",d:0},{id:1,n:"Awa Traoré",d:5000},{id:2,n:"Yao Kouassi",d:0}];
var PAY=[["CASH","Espèces"],["MOBILE_MONEY","Mobile Money"],["CARD","Carte"],["BANK_TRANSFER","Virement"],["CREDIT","Crédit"]];
var cart={},cat="Tout",tab="caisse",method="CASH",cust=0,sales=[];
var fmt=function(n){return n.toLocaleString("fr-FR")+" F"};
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},2200)}
function find(id){return items.filter(function(i){return i.id==id})[0]}
function total(){var s=0;for(var k in cart)s+=find(k).p*cart[k];return s}
function add(id,d){var it=find(id),q=(cart[id]||0)+d;if(q<=0){delete cart[id]}else if(!it.svc&&q>it.s){toast("Stock insuffisant");return}else{cart[id]=q}draw()}
function pay(){
  var tt=total();if(!tt)return;
  if(method=="CREDIT"&&!cust){toast("Le crédit nécessite un client");return}
  var lines=[];for(var k in cart){var it=find(k);lines.push(it.n+" ×"+cart[k]);if(!it.svc)it.s-=cart[k]}
  if(method=="CREDIT")customers.filter(function(c){return c.id==cust})[0].d+=tt;
  sales.unshift({no:1000+sales.length+1,t:tt,m:method,l:lines.join(", "),h:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})});
  cart={};toast("Vente enregistrée · "+fmt(tt));draw()
}
function tabs(){$("tabs").innerHTML=[["caisse","Caisse"],["stock","Stock"],["ventes","Ventes"]].map(function(t){return '<button class="tab'+(tab==t[0]?' on':'')+'" onclick="tab=\''+t[0]+'\';draw()">'+t[1]+'</button>'}).join("")}
function caisse(){
  var chips=CATS.map(function(c){return '<button class="chip'+(c==cat?' on':'')+'" onclick="cat=\''+c.replace("&","&amp;")+'\';draw()">'+c+'</button>'}).join("");
  var g=items.filter(function(i){return cat=="Tout"||i.c==cat}).map(function(i){
    var out=!i.svc&&i.s<=0,low=!i.svc&&i.s>0&&i.s<=i.t;
    return '<button class="p" '+(out?'disabled':'')+' onclick="add('+i.id+',1)">'+(low?'<span class="badge">Stock bas</span>':'')+'<span class="e">'+i.e+'</span><b>'+i.n+'</b><span>'+fmt(i.p)+'</span><small>'+(i.svc?'Service':(out?'Rupture':i.s+' en stock'))+'</small></button>'}).join("");
  var lines=Object.keys(cart).map(function(k){var it=find(k);return '<div class="line"><div class="n">'+it.n+'<br><small>'+fmt(it.p)+'</small></div><div class="q"><button onclick="add('+k+',-1)">−</button><b>'+cart[k]+'</b><button onclick="add('+k+',1)">+</button></div></div>'}).join("")||'<div class="empty">Touchez un article pour l’ajouter</div>';
  var opts=customers.map(function(c){return '<option value="'+c.id+'"'+(c.id==cust?' selected':'')+'>'+c.n+(c.d?' (dette '+fmt(c.d)+')':'')+'</option>'}).join("");
  var pm=PAY.map(function(p){return '<button class="'+(p[0]==method?'on':'')+'" onclick="method=\''+p[0]+'\';draw()">'+p[1]+'</button>'}).join("");
  return '<div class="pos"><div><div class="chips">'+chips+'</div><div class="grid">'+g+'</div></div><div class="panel"><h2>Panier</h2>'+lines+'<div class="tot"><span>Total</span><span>'+fmt(total())+'</span></div><select onchange="cust=+this.value;draw()">'+opts+'</select><div class="pay">'+pm+'</div><button class="go" '+(total()?'':'disabled')+' onclick="pay()">Encaisser</button></div></div>'
}
function stock(){
  var low=items.filter(function(i){return !i.svc&&i.s<=i.t}).length;
  var val=items.reduce(function(a,i){return a+(i.svc?0:i.s*i.p)},0);
  return '<div class="kpi"><div><b>'+items.filter(function(i){return !i.svc}).length+'</b><small>Articles suivis</small></div><div><b>'+low+'</b><small>Alertes stock</small></div><div><b>'+fmt(val)+'</b><small>Valeur (prix de vente)</small></div></div><div class="panel">'+items.filter(function(i){return !i.svc}).map(function(i){var lw=i.s<=i.t,w=Math.min(100,i.s/(i.t*4||1)*100);return '<div class="row"><div style="flex:1">'+i.e+' '+i.n+'<div class="bar'+(lw?' low':'')+'"><i style="width:'+w+'%"></i></div></div><b style="color:'+(lw?'var(--warn)':'inherit')+'">'+i.s+'</b></div>'}).join("")+'</div>'
}
function ventes(){
  var ca=sales.reduce(function(a,s){return a+s.t},0);
  var rows=sales.map(function(s){var m=PAY.filter(function(p){return p[0]==s.m})[0][1];return '<div class="row"><div>#'+s.no+' · '+s.h+'<br><small class="sub">'+s.l+'</small></div><div style="text-align:right"><b>'+fmt(s.t)+'</b><br><small class="sub">'+m+'</small></div></div>'}).join("")||'<div class="empty">Aucune vente pour l’instant. Encaisse un panier depuis la caisse.</div>';
  return '<div class="kpi"><div><b>'+sales.length+'</b><small>Ventes</small></div><div><b>'+fmt(ca)+'</b><small>Chiffre d’affaires</small></div><div><b>'+fmt(customers.reduce(function(a,c){return a+c.d},0))+'</b><small>Dettes clients</small></div></div><div class="panel">'+rows+'</div>'
}
function draw(){tabs();$("view").innerHTML=tab=="caisse"?caisse():tab=="stock"?stock():ventes()}
function tick(){$("clock").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}
tick();draw();
</script>
</body>
</html>
